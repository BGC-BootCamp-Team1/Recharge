<form class="recharge-form" >  
    <!-- //(submit)="navigateToComfirmPage($event) -->
    <label for="phone">Phone Number:</label>
    
    <div class="phone-input">
        <!-- <input type="tel" id="phone" placeholder="136xxxxxxxxx" /> -->
        <input type="tel" name="phone" 
        placeholder="Enter your phone number(11 digits)" 
        pattern="\d{11}"
        maxlength="11" required
        [(ngModel)]="phoneNumber"
        (input)="onInput()"
        [ngClass]="{'invalid':!isPhoneNumberValid&& phoneNumber.length === 11}">
        <span class="error" *ngIf="!isPhoneNumberValid&& phoneNumber.length === 11" >!!!</span>
        <span class="location">{{location}}</span>

    </div>

    <label for="discount">Promotion:</label>
    <select id="discount">
        <option>Mobile Store Recharge 9.95% Discount</option>
    </select>
    <span class="discount-tag">Discount - Mobile Store Recharge 9.95% Discount</span>

    <label>Recharge Amount(RMB):</label>
    <div class="amount-options">
        <button type="button" class="amount-btn">30</button>
        <button type="button" class="amount-btn">50</button>
        <button type="button" class="amount-btn active">100</button>
        <button type="button" class="amount-btn">300</button>
        <button type="button" class="amount-btn">500</button>
        <input type="text" size="10" class="amount-input" placeholder="10~3000" />
    </div>

    <div class="amount-summary">
        <p>Payment Amount: <span class="payment-amount">99.50 RMB</span></p>
        <p>Amount Received: <span class="received-amount">100.00 RMB</span></p>
    </div>

    <button type="submit" class="submit-btn" (click)="navigateToComfirmPage($event)" routerLink="/submit-btn">Start
        Recharge</button>

    <p class="note">Please carefully check the recharge number, as it cannot be refunded</p>
</form>
